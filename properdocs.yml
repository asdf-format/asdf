site_name: asdf
site_url: https://www.asdf-format.org/projects/asdf
repo_url: https://github.com/asdf-format/asdf
edit_uri: edit/main/docs/
repo_name: asdf-format/asdf
watch:
  - asdf
theme:
  name: material
  custom_dir: docs/overrides
  favicon: assets/favicon.ico
  logo: assets/logo-dark-mode.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.top
    - toc.follow
    - header.autohide
    - content.action.edit
    - content.action.view
    - content.code.select
    - content.code.copy
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra_css:
  - assets/stylesheets/extra.css

not_in_nav: |
  api/

# validation:
#   omitted_files: warn
#   absolute_links: warn  # Or 'relative_to_docs' - new in MkDocs 1.6
#   unrecognized_links: warn
#   anchors: warn  # New in MkDocs 1.6

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: pycon
          class: 'highlight'
          format: !!python/name:asdf._doc.pycon.strip_doctest_flags

plugins:
- search
- api-autonav:
      modules: ['asdf']
      api_root_uri: api
      exclude:
      - asdf.conftest
      on_implicit_namespace_package: skip
- literate-nav:
    nav_file: SUMMARY.md
- section-index
# - git-authors
# - git-revision-date-localized:
#     enable_creation_date: true
- mkdocstrings:
    handlers:
      python:
        inventories:
        - https://docs.python.org/3/objects.inv
        - "https://numpy.org/doc/stable/objects.inv"
        - "https://python-semanticversion.readthedocs.io/en/latest/objects.inv"
        - "https://docs.pytest.org/en/latest/objects.inv"
        - "https://packaging.python.org/en/latest/objects.inv"
        options:
          docstring_style: numpy
          docstring_options:
            warn_missing_types: true
            warn_unknown_params: true
            warnings: true
          separate_signature: true
          show_signature_annotations: true
          show_signature_type_parameters: true
          signature_crossrefs: true
          merge_init_into_class: true
          show_if_no_docstring: true
          find_stubs_package: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          line_length: 88
          filters: "public"
          summary:
            modules: false
            attributes: true
            functions: true
            classes: true
            type_aliases: true
          extensions:
            - griffe_sphinx
            - griffe_generics
            - griffe_inherited_docstrings
