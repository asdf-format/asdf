site_name: asdf
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://www.asdf-format.org/projects/asdf']
repo_url: https://github.com/asdf-format/asdf
edit_uri: edit/main/docs/
repo_name: asdf-format/asdf
site_author: The ASDF Developers
copyright: Copyright &copy; 2026, The ASDF Developers
watch:
  - asdf
  - README.md
  - changes
theme:
  name: material
  custom_dir: docs/.overrides
  favicon: assets/favicon.ico
  logo: assets/logo-dark-mode.png
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.path # Show path breadcrumbs for nested pages
  - navigation.top # Show "return to top" button when scrolling up
  - navigation.footer # Show "next/previous" page links in footer
  - toc.follow
  - header.autohide
  - content.action.edit
  - content.action.view
  - content.code.select
  - content.code.copy
  # Enable link previews for all internal links
  # It would be better to only enable previews for API links but currently that doesn't work
  # with the autorefs plugin (https://github.com/zensical/zensical/issues/985)
  - navigation.instant.preview
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

hooks:
- docs/.hooks/toctree.py
- docs/.hooks/strip_doctest_flags.py
- docs/.hooks/changelog.py
extra_css:
- assets/stylesheets/mkdocstrings.css
- assets/stylesheets/asdf.css
extra_javascript:
- assets/scripts/readthedocs.js

exclude_docs: |
  # literate-nav files not actually part of the final docs
  SUMMARY.md
not_in_nav: |
  # API docs are selectively included in navigation
  api/

validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
- toc:
    # Add permalinks to all headers
    permalink: true
- footnotes
# Required for several other plugins to work correctly
- attr_list
# Regular and collapsible admonitions
- admonition
- pymdownx.details
# Preprocessing to include snippets from other files
- pymdownx.snippets:
    base_path:
    - README.md
    - docs/
# Block and inline syntax highlighting
- pymdownx.highlight:
    anchor_linenums: true
    pygments_lang_class: true
    line_spans: __span
- pymdownx.inlinehilite
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
# Convert `--` to emdash, `...` to ellipse, etc
- smarty
- pymdownx.smartsymbols

plugins:
- search
- autorefs
# Generate API docs pages for all modules automatically
- api-autonav:
    modules: ['asdf']
    api_root_uri: api
    exclude:
    - asdf.conftest
    on_implicit_namespace_package: skip
- literate-nav:
    nav_file: SUMMARY.md
    implicit_index: true
- section-index
# Show last modified date for pages
- git-revision-date-localized:
    fallback_to_build_date: true
- mkdocstrings:
    handlers:
      python:
        options:
          ### General ###
          docstring_style: numpy
          find_stubs_package: true
          extensions:
          # Parse sphinx-style `#:` attribute docstrings
          - griffe_sphinx
          # Resolve generic typevars in subclasses
          - griffe_generics
          # Copy docstrings from parent class for classes/methods without docstrings
          - griffe_inherited_docstrings
          ### Members ###
          filters: "public"
          inherited_members: true
          show_if_no_docstring: true
          # No summary table for submodules since we manually organize the module navigation
          summary:
            modules: false
            attributes: true
            functions: true
            classes: true
            type_aliases: true
          ### Signature Formatting ###
          separate_signature: true
          show_signature_annotations: true
          show_signature_type_parameters: true
          signature_crossrefs: true
          line_length: 88
          ### Header Formatting ###
          # Show `mod`/`func`/etc prefix before headers and in TOC
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          ### Docstrings ###
          merge_init_into_class: true
        # Load sphinx-style inventories
        inventories:
        - https://docs.python.org/3/objects.inv
        - https://numpy.org/doc/stable/objects.inv
        - https://python-semanticversion.readthedocs.io/en/latest/objects.inv
        - url: https://docs.pytest.org/en/latest/objects.inv
          domains: ["std", "py"]
        - https://packaging.python.org/en/latest/objects.inv
        - url: https://www.asdf-format.org/projects/asdf-standard/en/latest/objects.inv
          domains: ["std", "py"]
        - url: https://stdatamodels.readthedocs.io/en/latest/objects.inv
          domains: ["std", "py"]

extra:
  header_links:
  - title: ASDF Projects
    href: https://www.asdf-format.org
  - title: Tutorials
    href: https://www.asdf-format.org/en/latest/tutorials/index.html
  - title: Community
    href: https://www.asdf-format.org/en/latest/community/index.html
  changelog:
    src_uri: CHANGES.md
